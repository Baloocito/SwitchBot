# Va en el repo como: .github/workflows/alertas.yml
name: Alertas de ofertas Switch

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:          # para correrlo a mano desde la pestaña Actions
    inputs:
      modo:
        description: "normal = revisar precios · diagnostico = probar las tiendas"
        type: choice
        options: [normal, diagnostico]
        default: normal
      termino:
        description: "Búsqueda para el diagnóstico"
        default: "zelda"

permissions:
  contents: write             # para guardar state.json

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Diagnóstico de tiendas
        if: ${{ inputs.modo == 'diagnostico' }}
        run: python bot.py --diagnostico "${{ inputs.termino }}"

      - name: Revisar precios
        if: ${{ inputs.modo != 'diagnostico' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar estado
        if: ${{ inputs.modo != 'diagnostico' }}
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          git diff --cached --quiet || git commit -m "Actualiza precios"
          git push
