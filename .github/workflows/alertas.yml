# Va en el repo como: .github/workflows/alertas.yml
name: Alertas de ofertas Switch

on:
  schedule:
    - cron: "17 * * * *"     # cada hora: el bot decide si toca revisar (cada 6 h, cada 1 h en
                              # modo evento) o mandar el resumen diario
  workflow_dispatch:          # para correrlo a mano desde la pestaña Actions
    inputs:
      modo:
        description: "normal = revisar ya · resumen = mandar el resumen ya · diagnostico = probar las tiendas · programado = lo usa el reloj del Worker"
        type: choice
        options: [normal, resumen, diagnostico, programado]
        default: normal
      termino:
        description: "Búsqueda para el diagnóstico"
        default: "zelda"

permissions:
  contents: write             # para guardar state.json

concurrency:
  group: alertas              # el canal tiene su propio grupo ("canal") y publica los bombazos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Diagnóstico de tiendas
        if: ${{ inputs.modo == 'diagnostico' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
        run: python bot.py --diagnostico "${{ inputs.termino }}"

      - name: Guardar páginas del diagnóstico
        if: ${{ inputs.modo == 'diagnostico' }}
        uses: actions/upload-artifact@v4
        with:
          name: paginas-tiendas
          path: diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      # Copia las mismas páginas a la rama "diagnostico" (se reemplaza en cada corrida),
      # para poder estudiarlas sin descargar el zip a mano.
      - name: Publicar páginas en la rama diagnostico
        if: ${{ inputs.modo == 'diagnostico' }}
        continue-on-error: true
        run: |
          [ -d diagnostico ] || exit 0
          cp -r diagnostico /tmp/diag && rm -rf diagnostico
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git checkout --orphan diag-tmp
          git rm -rfq . >/dev/null
          cp -r /tmp/diag/. .
          git add -A
          git commit -qm "Paginas del diagnostico"
          git push -f origin HEAD:diagnostico

      - name: Revisar precios
        if: ${{ inputs.modo != 'diagnostico' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
        timeout-minutes: 40         # el paso se corta antes que el job: asi el log igual se publica
        run: |
          set -o pipefail
          if [ "${{ inputs.modo }}" = "resumen" ]; then ARGS="--resumen"
          elif [ "${{ inputs.modo }}" = "programado" ]; then ARGS=""
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--forzar"
          else ARGS=""; fi
          python -u bot.py $ARGS 2>&1 | tee /tmp/revision.log

      # El log de la ultima revision queda en la rama "logs" (tambien si fallo o se corto),
      # para poder leerlo sin descargar nada.
      - name: Publicar log
        if: ${{ always() && inputs.modo != 'diagnostico' }}
        continue-on-error: true
        run: |
          [ -f /tmp/revision.log ] || exit 0
          cd "$(mktemp -d)"
          git init -q && git checkout -q -b logs
          cp /tmp/revision.log revision.log
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add revision.log && git commit -qm "Log ${{ github.run_id }} (${{ job.status }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs

      # Si la revision se cae, te avisa al chat con el error (antes solo se veia "canal en pausa")
      - name: Avisar si fallo
        if: ${{ failure() && inputs.modo != 'diagnostico' }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERR=$(grep -E "Error|error|Traceback" /tmp/revision.log 2>/dev/null | tail -2 | cut -c1-300)
          TXT="⚠️ La revisión de precios falló y no se guardó. Lo reviso en el registro (rama logs).
          ${ERR}"
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TXT}"

      - name: Guardar estado
        if: ${{ inputs.modo != 'diagnostico' }}
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add state.json history.json vistas 2>/dev/null || git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualiza precios"
          # si el repo cambió mientras corría el bot, trae esos cambios y reintenta
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
