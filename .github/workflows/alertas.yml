# Guardar en el repo como: .github/workflows/alertas.yml
name: Alertas de ofertas Switch

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write             # para guardar state.json

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar precios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar estado
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza precios"
          git push
